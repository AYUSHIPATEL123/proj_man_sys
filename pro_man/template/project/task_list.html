{% extends 'base.html' %}
{% block title %}
Project List
{% endblock  %}
{% block content %}
<div class="container py-5">

  <!-- Page Title -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Tasks</h2>
  </div>

  <!-- Products Grid -->
  <div class="row g-4">
        <button type="button"><a href="{% url 'task_create' %}" class="text-decoration-none" >create new task</a></button>
{% for task in tasks %}
    <!-- Product Card -->
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100 shadow-sm">  
        <div class="card-body d-flex flex-column">
          <a href="{{ task.get_url }}"><h4 class="card-title">Name : {{ task.name }} </h4> </a>
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="fw-bold">Started At : {{task.created_at}} </span>
          </div>
          <p class="text-muted small">{{task.description}}</p>
        </div>
      </div>
    </div>
{% endfor %}
  </div>
</div>
{% endblock %}
